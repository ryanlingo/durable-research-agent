<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img">
  <rect width="1000" height="400" fill="#FAFAFA"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/>
    </marker>
    <style>
    .label { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 17px; fill: #1A1A1A; }
    .title { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 15px; fill: #555555; }
    .box { fill: #FFFFFF; stroke: #1A1A1A; stroke-width: 1.75; }
    .box-fill { fill: #E8E8E8; stroke: #1A1A1A; stroke-width: 1.75; }
    .line { stroke: #1A1A1A; stroke-width: 1.75; fill: none; }
</style>
  </defs>

  <text x="500" y="36" text-anchor="middle" class="title">With Temporal · Worker Process dies mid-Activity</text>
  <rect x="30" y="80" width="140" height="48" rx="16" class="box"/>
  <text x="100.0" y="110.0" text-anchor="middle" class="label">Activity</text>
  <rect x="200" y="80" width="140" height="48" rx="16" class="box"/>
  <text x="270.0" y="110.0" text-anchor="middle" class="label">Activity</text>
  <rect x="370" y="80" width="140" height="48" rx="16" class="box"/>
  <text x="440.0" y="110.0" text-anchor="middle" class="label">Activity</text>
  <rect x="540" y="80" width="150" height="48" rx="16" class="box-fill"/>
  <text x="615.0" y="110.0" text-anchor="middle" class="label">Activity</text>
  <rect x="720" y="80" width="120" height="48" rx="16" class="box"/>
  <text x="780.0" y="110.0" text-anchor="middle" class="label">Activity</text>
  <rect x="870" y="80" width="100" height="48" rx="16" class="box"/>
  <text x="920.0" y="110.0" text-anchor="middle" class="label">Signal</text>
  <line x1="170" y1="104" x2="192" y2="104" class="line" marker-end="url(#arrow)"/>
  <line x1="340" y1="104" x2="362" y2="104" class="line" marker-end="url(#arrow)"/>
  <line x1="510" y1="104" x2="532" y2="104" class="line" marker-end="url(#arrow)"/>
  <line x1="690" y1="104" x2="712" y2="104" class="line" marker-end="url(#arrow)"/>
  <line x1="840" y1="104" x2="862" y2="104" class="line" marker-end="url(#arrow)"/>
  <line x1="615" y1="58" x2="615" y2="145" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="615" y="52" text-anchor="middle" class="title">Worker dies</text>
  <text x="500" y="195" text-anchor="middle" class="label">After Worker Process restarts</text>
  <rect x="80" y="230" width="240" height="52" rx="16" class="box"/>
  <text x="200.0" y="262.0" text-anchor="middle" class="label">Event History replay</text>
  <line x1="320" y1="256" x2="380" y2="256" class="line" marker-end="url(#arrow)"/>
  <rect x="390" y="230" width="280" height="52" rx="16" class="box-fill"/>
  <text x="530.0" y="262.0" text-anchor="middle" class="label">Resume Workflow Execution</text>
  <line x1="670" y1="256" x2="730" y2="256" class="line" marker-end="url(#arrow)"/>
  <rect x="740" y="230" width="200" height="52" rx="16" class="box"/>
  <text x="840.0" y="262.0" text-anchor="middle" class="label">Reuse Activity results</text>
  <text x="500" y="350" text-anchor="middle" class="title">Durable Execution: state and progress survive Worker failure</text>
</svg>
