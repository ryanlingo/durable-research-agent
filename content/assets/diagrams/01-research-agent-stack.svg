<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780" role="img">
  <rect width="900" height="780" fill="#FAFAFA"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/>
    </marker>
    <style>
    .label { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 17px; fill: #1A1A1A; }
    .title { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 15px; fill: #555555; }
    .box { fill: #FFFFFF; stroke: #1A1A1A; stroke-width: 1.75; }
    .box-fill { fill: #E8E8E8; stroke: #1A1A1A; stroke-width: 1.75; }
    .line { stroke: #1A1A1A; stroke-width: 1.75; fill: none; }
</style>
  </defs>

  <rect x="40" y="40" width="170" height="54" rx="16" class="box"/>
  <text x="125.0" y="73.0" text-anchor="middle" class="label">Query</text>
  <rect x="365" y="40" width="170" height="54" rx="16" class="box-fill"/>
  <text x="450.0" y="73.0" text-anchor="middle" class="label">Research agent</text>
  <rect x="690" y="40" width="170" height="54" rx="16" class="box"/>
  <text x="775.0" y="73.0" text-anchor="middle" class="label">Report</text>
  <line x1="210" y1="67" x2="357" y2="67" class="line" marker-end="url(#arrow)"/>
  <line x1="535" y1="67" x2="682" y2="67" class="line" marker-end="url(#arrow)"/>
  <line x1="450" y1="94" x2="450" y2="150" class="line"/>
  <polygon points="450,150 560,200 450,250 340,200" class="box"/>
  <text x="450" y="206" text-anchor="middle" class="label">Plan</text>
  <line x1="450" y1="250" x2="450" y2="290" class="line"/>
  <polygon points="450,290 575,350 450,410 325,350" class="box"/>
  <text x="450" y="346" text-anchor="middle" class="label">RAG + search</text>
  <text x="450" y="366" text-anchor="middle" class="title">parallel tools</text>
  <line x1="450" y1="410" x2="450" y2="450" class="line"/>
  <polygon points="450,460 560,510 450,560 340,510" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="450" y="516" text-anchor="middle" class="label">Evaluate</text>
  <line x1="450" y1="560" x2="450" y2="600" stroke="#1A1A1A" stroke-width="1.35" stroke-dasharray="3 5" fill="none"/>
  <polygon points="450,615 545,660 450,705 355,660" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="2 6"/>
  <text x="450" y="666" text-anchor="middle" class="label">Approval</text>
</svg>
