<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160" role="img">
  <rect width="1000" height="160" fill="#FAFAFA"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/>
    </marker>
    <style>
    .label { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 17px; fill: #1A1A1A; }
    .title { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 15px; fill: #555555; }
    .box { fill: #FFFFFF; stroke: #1A1A1A; stroke-width: 1.75; }
    .box-fill { fill: #E8E8E8; stroke: #1A1A1A; stroke-width: 1.75; }
    .line { stroke: #1A1A1A; stroke-width: 1.75; fill: none; }
</style>
  </defs>

  <rect x="20" y="50" width="110" height="48" rx="16" class="box"/>
  <text x="75.0" y="80.0" text-anchor="middle" class="label">Clarify</text>
  <rect x="160" y="50" width="100" height="48" rx="16" class="box"/>
  <text x="210.0" y="80.0" text-anchor="middle" class="label">Plan</text>
  <rect x="290" y="50" width="110" height="48" rx="16" class="box"/>
  <text x="345.0" y="80.0" text-anchor="middle" class="label">Retrieve</text>
  <rect x="430" y="50" width="100" height="48" rx="16" class="box"/>
  <text x="480.0" y="80.0" text-anchor="middle" class="label">Search</text>
  <rect x="560" y="50" width="100" height="48" rx="16" class="box-fill"/>
  <text x="610.0" y="80.0" text-anchor="middle" class="label">Write</text>
  <rect x="690" y="50" width="100" height="48" rx="16" class="box"/>
  <text x="740.0" y="80.0" text-anchor="middle" class="label">Eval</text>
  <rect x="820" y="50" width="140" height="48" rx="16" class="box"/>
  <text x="890.0" y="80.0" text-anchor="middle" class="label">Approve</text>
  <line x1="130" y1="74" x2="152" y2="74" class="line" marker-end="url(#arrow)"/>
  <line x1="260" y1="74" x2="282" y2="74" class="line" marker-end="url(#arrow)"/>
  <line x1="400" y1="74" x2="422" y2="74" class="line" marker-end="url(#arrow)"/>
  <line x1="530" y1="74" x2="552" y2="74" class="line" marker-end="url(#arrow)"/>
  <line x1="660" y1="74" x2="682" y2="74" class="line" marker-end="url(#arrow)"/>
  <line x1="790" y1="74" x2="812" y2="74" class="line" marker-end="url(#arrow)"/>
</svg>
