<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img">
  <rect width="960" height="500" fill="#FAFAFA"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/>
    </marker>
    <style>
    .label { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 17px; fill: #1A1A1A; }
    .title { font-family: Inter, Helvetica, Arial, sans-serif; font-size: 15px; fill: #555555; }
    .box { fill: #FFFFFF; stroke: #1A1A1A; stroke-width: 1.75; }
    .box-fill { fill: #E8E8E8; stroke: #1A1A1A; stroke-width: 1.75; }
    .line { stroke: #1A1A1A; stroke-width: 1.75; fill: none; }
</style>
  </defs>

  <text x="240" y="40" text-anchor="middle" class="label">Without Temporal</text>
  <text x="720" y="40" text-anchor="middle" class="label">With Temporal</text>
  <rect x="90" y="70" width="300" height="52" rx="16" class="box-fill"/>
  <text x="240.0" y="102.0" text-anchor="middle" class="label">awaiting approval</text>
  <rect x="570" y="70" width="300" height="52" rx="16" class="box-fill"/>
  <text x="720.0" y="102.0" text-anchor="middle" class="label">Workflow Execution</text>
  <line x1="240" y1="122" x2="240" y2="160" class="line"/>
  <line x1="720" y1="122" x2="720" y2="160" class="line"/>
  <polygon points="240,160 340,210 240,260 140,210" class="box"/>
  <text x="240" y="216" text-anchor="middle" class="label">Live process</text>
  <polygon points="720,160 830,210 720,260 610,210" class="box"/>
  <text x="720" y="216" text-anchor="middle" class="label">Wait on Signal</text>
  <line x1="240" y1="260" x2="240" y2="300" class="line"/>
  <line x1="720" y1="260" x2="720" y2="300" class="line"/>
  <polygon points="240,305 350,360 240,415 130,360" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="240" y="356" text-anchor="middle" class="label">Poll SQLite</text>
  <text x="240" y="376" text-anchor="middle" class="title">every 2s</text>
  <polygon points="720,305 830,360 720,415 610,360" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="720" y="356" text-anchor="middle" class="label">Signal arrives</text>
  <text x="720" y="376" text-anchor="middle" class="title">Query can report state</text>
  <line x1="240" y1="415" x2="240" y2="445" class="line" marker-end="url(#arrow)"/>
  <line x1="720" y1="415" x2="720" y2="445" class="line" marker-end="url(#arrow)"/>
  <text x="240" y="475" text-anchor="middle" class="title">approve CLI updates row</text>
  <text x="720" y="475" text-anchor="middle" class="title">signal_approval</text>
</svg>
